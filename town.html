<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小鲸鱼的世界 · Painted Town</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --paper: #f6efdf;
        --paper2: #efe4cc;
        --ink: #26333f;
        --ink2: #5a6b7a;
        --blue: #2f6d97;
        --blue2: #6fa8c8;
        --gold: #d9a83c;
        --red: #c2543f;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #cfe2ea;
        color: var(--ink);
        font: 14px/1.55 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', system-ui, sans-serif;
        user-select: none;
        -webkit-font-smoothing: antialiased;
      }
      canvas#view {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }
      canvas#view:active {
        cursor: grabbing;
      }
      /* ---------- 加载 ---------- */
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, #eaf3f7, #cfe2ea 70%);
        z-index: 50;
        transition: opacity 0.6s;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading .box {
        text-align: center;
        color: var(--ink2);
      }
      #loading b {
        display: block;
        font-size: 26px;
        letter-spacing: 0.16em;
        color: var(--ink);
        font-weight: 600;
        margin-bottom: 10px;
      }
      #loading .bar {
        width: 260px;
        height: 4px;
        margin: 16px auto 0;
        background: rgba(38, 51, 63, 0.14);
        border-radius: 4px;
        overflow: hidden;
      }
      #loading .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--blue2), var(--blue));
        transition: width 0.3s;
      }
      /* ---------- HUD ---------- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .card {
        background: rgba(246, 239, 223, 0.92);
        border: 1px solid rgba(38, 51, 63, 0.18);
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(30, 45, 60, 0.16);
        backdrop-filter: blur(6px);
      }
      #status {
        position: absolute;
        top: 14px;
        left: 14px;
        padding: 10px 13px;
        min-width: 196px;
        font-size: 13px;
      }
      #status .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        line-height: 1.9;
      }
      #status .k {
        color: var(--ink2);
      }
      #status .v {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .meter {
        height: 5px;
        border-radius: 3px;
        background: rgba(38, 51, 63, 0.13);
        overflow: hidden;
        margin: 1px 0 5px;
      }
      .meter > i {
        display: block;
        height: 100%;
        width: 50%;
        transition: width 0.25s;
      }
      .meter.hunger > i {
        background: linear-gradient(90deg, #e0913f, #d06a3a);
      }
      .meter.stamina > i {
        background: linear-gradient(90deg, #6fbf8a, #3f9a76);
      }
      #bag {
        position: absolute;
        top: 14px;
        left: 232px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        max-width: 380px;
      }
      .bag-item {
        position: relative;
        background: rgba(246, 239, 223, 0.92);
        border: 1px solid rgba(38, 51, 63, 0.16);
        border-radius: 9px;
        padding: 4px 7px;
        font-size: 16px;
        box-shadow: 0 3px 10px rgba(30, 45, 60, 0.12);
      }
      .bag-item b {
        font-size: 11px;
        margin-left: 3px;
        color: var(--ink2);
        vertical-align: super;
      }
      #prompt {
        position: absolute;
        left: 50%;
        bottom: 96px;
        transform: translate(-50%, 8px);
        padding: 8px 18px;
        background: rgba(28, 42, 54, 0.82);
        color: #fdf6e6;
        border-radius: 999px;
        font-size: 14px;
        letter-spacing: 0.04em;
        opacity: 0;
        transition: all 0.18s;
        white-space: nowrap;
      }
      #prompt.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #prompt kbd {
        background: #fdf6e6;
        color: #1c2a36;
        border-radius: 4px;
        padding: 0 5px;
        font: inherit;
        font-weight: 700;
        margin-right: 6px;
      }
      #toast {
        position: absolute;
        left: 50%;
        top: 76px;
        transform: translate(-50%, -8px);
        padding: 9px 18px;
        background: rgba(246, 239, 223, 0.96);
        border-left: 4px solid var(--gold);
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(30, 45, 60, 0.2);
        opacity: 0;
        transition: all 0.22s;
        font-size: 14px;
        color: var(--ink);
        max-width: 60vw;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #help {
        position: absolute;
        left: 14px;
        bottom: 14px;
        padding: 8px 12px;
        font-size: 12px;
        color: var(--ink2);
        line-height: 1.8;
      }
      #help kbd {
        background: rgba(38, 51, 63, 0.1);
        border-radius: 4px;
        padding: 1px 5px;
        font: inherit;
        font-weight: 700;
        color: var(--ink);
      }
      /* ---------- 小地图 ---------- */

      /* ---------- 动作栏 / 天气牌 / 氧气 / 水下 / 背包格子 ---------- */
      #actionbar {
        position: absolute;
        left: 50%;
        bottom: 62px;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: calc(100vw - 520px);
      }
      #actionbar.indoor .act:not(.menu) {
        display: none;
      }
      .act {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px 6px 7px;
        border: 1px solid rgba(38, 51, 63, 0.18);
        border-radius: 12px;
        background: rgba(246, 239, 223, 0.94);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(30, 40, 50, 0.14);
        transition: transform 0.12s, opacity 0.2s;
      }
      .act:hover {
        transform: translateY(-2px);
      }
      .act kbd {
        min-width: 22px;
        padding: 1px 5px;
        border-radius: 6px;
        background: var(--blue);
        color: #fff;
        font: 700 11px/18px inherit;
        text-align: center;
      }
      .act.menu kbd {
        background: var(--gold);
        color: var(--ink);
      }
      .act.off {
        opacity: 0.38;
        cursor: default;
        transform: none;
      }
      #weather-chip {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        font-size: 13px;
        white-space: nowrap;
      }
      #weather-chip .wi {
        font-size: 18px;
      }
      #weather-chip .dim {
        color: var(--ink2);
      }
      #o2 {
        position: absolute;
        left: 14px;
        top: 186px;
        width: 196px;
        padding: 8px 12px;
        display: none;
        font-size: 12px;
      }
      #o2.on {
        display: block;
      }
      .meter.o2 i {
        background: linear-gradient(90deg, #7ec8e8, #2f6d97);
      }
      #underwater {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s;
        background: radial-gradient(ellipse at 50% 20%, rgba(120, 210, 230, 0.1), rgba(10, 60, 90, 0.42) 75%), repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.035) 0 18px, transparent 18px 44px);
        mix-blend-mode: multiply;
        z-index: 5;
      }
      #underwater.on {
        opacity: 1;
      }
      .bag-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 8px;
        margin: 10px 0;
      }
      .bag-grid .slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 10px 6px 8px;
        border-radius: 12px;
        border: 1px solid rgba(38, 51, 63, 0.16);
        background: rgba(255, 255, 255, 0.55);
        font: inherit;
        color: var(--ink);
        cursor: pointer;
      }
      .bag-grid .slot:hover {
        background: #fff;
      }
      .bag-grid .slot.cur {
        border-color: var(--blue);
        box-shadow: 0 0 0 2px rgba(47, 109, 151, 0.25);
      }
      .bag-grid .ic {
        font-size: 26px;
      }
      .bag-grid i {
        font-style: normal;
        color: var(--ink2);
        font-size: 12px;
      }
      @media (max-width: 1100px) {
        #actionbar {
          max-width: calc(100vw - 260px);
          bottom: 70px;
        }
      }
      .bag-grid.dex .slot {
        cursor: default;
        min-height: 112px;
        justify-content: flex-end;
      }
      .bag-grid.dex .ic {
        min-height: 54px;
        display: flex;
        align-items: center;
      }
      .bag-grid .unknown .ic span {
        filter: brightness(0) opacity(0.22);
      }
      .bag-grid .unknown b {
        color: var(--ink2);
      }
      .r1 { color: #6b7a62; }
      .r2 { color: #2f6d97; }
      .r3 { color: #9a4fc2; }
      .r4 { color: #c27a14; font-weight: 700; }
      .tag {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 8px;
        background: rgba(38, 51, 63, 0.07);
      }
      .catch {
        display: flex;
        gap: 14px;
        align-items: center;
      }
      .catch .pic {
        width: 160px;
        min-height: 90px;
        display: grid;
        place-items: center;
      }
      .catch p {
        margin: 4px 0;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 4px;
      }
      .tab {
        padding: 5px 14px;
        border-radius: 10px;
        border: 1px solid rgba(38, 51, 63, 0.18);
        background: rgba(255, 255, 255, 0.5);
        font: inherit;
        color: var(--ink);
        cursor: pointer;
      }
      .tab.on {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      /* ---------- 大地图 ---------- */
      #bigmap {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(24, 34, 44, 0.5);
        z-index: 45;
      }
      #bigmap.on {
        display: grid;
      }
      .bm-frame {
        width: min(1240px, 96vw);
        height: min(820px, 92vh);
        display: flex;
        flex-direction: column;
        background: var(--paper);
        border-radius: 18px;
        box-shadow: 0 24px 70px rgba(20, 30, 40, 0.5);
        overflow: hidden;
      }
      .bm-head {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px dashed rgba(38, 51, 63, 0.2);
      }
      .bm-head b {
        font-size: 18px;
        letter-spacing: 0.1em;
      }
      .bm-head .tabs {
        margin: 0;
      }
      .bm-head .dim {
        margin-left: auto;
        color: var(--ink2);
        font-size: 12px;
      }
      .bm-x {
        border: 0;
        background: none;
        font-size: 18px;
        cursor: pointer;
        color: var(--ink2);
      }
      .bm-body {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .bm-view {
        position: relative;
        flex: 1;
        margin: 10px;
        border-radius: 12px;
        overflow: hidden;
        background: #e9dcbc;
        box-shadow: inset 0 0 0 1px rgba(58, 46, 34, 0.25);
      }
      #bigmap-canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }
      #bigmap-canvas:active {
        cursor: grabbing;
      }
      #bigmap-paper {
        display: none;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #e9dcbc;
      }
      #bigmap.paper #bigmap-paper {
        display: block;
      }
      #bigmap.paper .bm-zoom {
        display: none;
      }
      .bm-zoom {
        position: absolute;
        right: 12px;
        bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .bm-zoom button {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid rgba(38, 51, 63, 0.2);
        background: rgba(246, 239, 223, 0.95);
        font-size: 16px;
        cursor: pointer;
        color: var(--ink);
      }
      #bigmap-side {
        width: 260px;
        padding: 14px 16px 14px 4px;
        overflow: auto;
        font-size: 13px;
      }
      .bm-sec {
        margin: 6px 0 8px;
        color: var(--ink2);
      }
      .bm-card {
        padding: 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(38, 51, 63, 0.14);
        margin-bottom: 12px;
        line-height: 1.7;
      }
      .bm-title {
        font-size: 16px;
        font-weight: 700;
      }
      .bm-btns {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .bm-btns button {
        flex: 1;
        padding: 6px 8px;
        border-radius: 9px;
        border: 1px solid rgba(38, 51, 63, 0.2);
        background: #fff;
        font: inherit;
        cursor: pointer;
      }
      .bm-btns button.primary {
        background: var(--blue);
        color: #fff;
        border-color: var(--blue);
      }
      .bm-legend {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 10px;
      }
      .bm-line {
        display: inline-block;
        width: 18px;
        height: 4px;
        border-radius: 2px;
        margin-right: 4px;
        vertical-align: middle;
      }
      .bm-line.bus {
        background: repeating-linear-gradient(90deg, #e88c34 0 5px, transparent 5px 8px);
      }
      .bm-line.road {
        background: #f8eed6;
        box-shadow: 0 0 0 1.5px #78604a;
      }
      .bm-line.lane {
        background: repeating-linear-gradient(90deg, #8c6c46 0 3px, transparent 3px 6px);
      }
      #minimap-wrap {
        cursor: pointer;
      }
      #papermap {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(30, 40, 50, 0.45);
        z-index: 40;
      }
      #papermap.on {
        display: grid;
      }
      #papermap figure {
        margin: 0;
        padding: 12px 12px 8px;
        background: var(--paper);
        border-radius: 14px;
        box-shadow: 0 18px 60px rgba(20, 30, 40, 0.45);
        transform: rotate(-0.6deg);
      }
      #papermap img {
        display: block;
        height: min(78vh, 86vw);
        aspect-ratio: 1;
        border-radius: 8px;
      }
      #papermap figcaption {
        padding-top: 8px;
        text-align: center;
        color: var(--ink2);
        font-size: 13px;
      }
      #minimap-wrap {
        position: absolute;
        right: 14px;
        bottom: 14px;
        width: 210px;
        padding: 8px;
        pointer-events: auto;
      }
      #minimap {
        display: block;
        width: 194px;
        height: 194px;
        border-radius: 8px;
        background: #1d2a33;
        image-rendering: pixelated;
      }
      #minimap-label {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--ink2);
        margin-top: 5px;
        letter-spacing: 0.05em;
      }
      /* ---------- 面板 ---------- */
      #panel {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(24, 36, 47, 0.4);
        pointer-events: auto;
        z-index: 20;
      }
      #panel.on {
        display: grid;
      }
      /* 钓鱼这种要看着画面的：贴在底部的小条，不压暗、不挡画面 */
      #panel.dock {
        background: transparent;
        pointer-events: none;
        align-items: end;
        padding-bottom: 116px;
      }
      #panel.dock .sheet {
        pointer-events: auto;
        width: min(380px, 90vw);
        padding: 10px 16px;
        box-shadow: 0 10px 30px rgba(20, 32, 44, 0.28);
      }
      #panel .sheet {
        width: min(660px, 90vw);
        max-height: 82vh;
        overflow: auto;
        background: var(--paper);
        border-radius: 16px;
        box-shadow: 0 24px 60px rgba(20, 32, 44, 0.4);
        border: 1px solid rgba(38, 51, 63, 0.14);
        padding: 20px 22px 16px;
        animation: pop 0.18s ease-out;
      }
      @keyframes pop {
        from {
          transform: translateY(10px) scale(0.985);
          opacity: 0;
        }
      }
      #panel-title {
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.06em;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 2px dashed rgba(38, 51, 63, 0.18);
        color: var(--ink);
      }
      #panel-body {
        font-size: 14px;
        line-height: 1.85;
        color: var(--ink);
      }
      #panel-foot {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid rgba(38, 51, 63, 0.12);
      }
      #panel-foot button {
        pointer-events: auto;
        font: inherit;
        padding: 8px 16px;
        border-radius: 9px;
        border: 1px solid rgba(38, 51, 63, 0.25);
        background: var(--paper2);
        color: var(--ink);
        cursor: pointer;
        transition: all 0.12s;
      }
      #panel-foot button:hover {
        background: #fff;
        transform: translateY(-1px);
      }
      #panel-foot button.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: #fdf8ee;
      }
      #panel-foot button.primary:hover {
        background: #3b82ad;
      }
      #panel-foot button:disabled {
        opacity: 0.42;
        cursor: not-allowed;
        transform: none;
      }
      #panel kbd {
        background: rgba(38, 51, 63, 0.12);
        border-radius: 4px;
        padding: 1px 6px;
        font: inherit;
        font-weight: 700;
      }
      .dim {
        color: var(--ink2);
        font-size: 13px;
      }
      .ok {
        color: #2f8f63;
        font-weight: 600;
      }
      .no {
        color: #b4483a;
        font-weight: 600;
      }
      .warn {
        color: #c9402a;
        font-weight: 700;
      }
      table.recipes {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      table.recipes td,
      table.recipes th {
        padding: 6px 8px;
        border-bottom: 1px dashed rgba(38, 51, 63, 0.14);
        text-align: left;
        vertical-align: top;
      }
      table.recipes th {
        color: var(--ink2);
        font-weight: 600;
      }
      table.recipes .need {
        white-space: nowrap;
        color: var(--ink2);
      }
      ul.posts {
        margin: 8px 0;
        padding-left: 18px;
      }
      ul.posts li {
        margin: 3px 0;
      }
      .rail {
        position: relative;
        height: 26px;
        margin: 14px 0;
        border-radius: 13px;
        background: rgba(38, 51, 63, 0.12);
        overflow: hidden;
      }
      .rail-zone {
        position: absolute;
        left: 36%;
        width: 28%;
        top: 0;
        bottom: 0;
        background: rgba(47, 109, 151, 0.25);
      }
      .rail-needle {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 4px;
        background: var(--red);
        border-radius: 2px;
        transition: left 0.05s linear;
      }
      .locked canvas#view {
        cursor: none;
      }
      body.locked #help {
        opacity: 0.35;
      }
      @media (max-width: 760px) {
        #bag {
          left: 14px;
          top: 96px;
        }
        #minimap-wrap {
          width: 150px;
        }
        #minimap {
          width: 134px;
          height: 134px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="hud">
      <div id="status" class="card">
        <div class="row"><span class="k">金币</span><span class="v" id="stat-coins">0</span></div>
        <div class="row"><span class="k">时间</span><span class="v" id="stat-clock">第 1 天 08:20</span></div>
        <div class="row"><span class="k">所在</span><span class="v" id="stat-place">清镇野外</span></div>
        <div class="k" style="margin-top: 6px">饱食</div>
        <div class="meter hunger"><i id="stat-hunger"></i></div>
        <div class="k">体力</div>
        <div class="meter stamina"><i id="stat-stamina"></i></div>
      </div>

      <div id="bag"></div>

      <div id="prompt"></div>
      <div id="toast"></div>

      <div id="help" class="card">
        <kbd>W A S D</kbd> 走 · <kbd>E</kbd> 互动 · <kbd>M</kbd> 地图 · <kbd>P</kbd> 笔触 · 拖鼠标转视角 · 滚轮远近
      </div>

      <div id="weather-chip" class="card"></div>
      <div id="o2" class="card"><span class="k">氧气</span><div class="meter o2"><i id="stat-o2"></i></div></div>
      <div id="actionbar"></div>

      <div id="minimap-wrap" class="card">
        <canvas id="minimap" width="194" height="194"></canvas>
        <div id="minimap-label"><span>小地图</span><span id="minimap-mode">M 大地图</span></div>
      </div>

      <div id="panel">
        <div class="sheet">
          <div id="panel-title"></div>
          <div id="panel-body"></div>
          <div id="panel-foot"></div>
        </div>
      </div>
    </div>

    <div id="underwater"></div>

    <div id="loading">
      <div class="box">
        <b>小鲸鱼的世界</b>
        <span id="loading-text">正在铺路…</span>
        <div class="bar"><i id="loading-bar"></i></div>
      </div>
    </div>

    <script type="module" src="./src/town/main.js"></script>
    <!-- 大地图（M） -->
    <div id="bigmap">
      <div class="bm-frame">
        <div class="bm-head">
          <b>地图</b>
          <div class="tabs">
            <button class="tab on" data-tab="map">大地图</button>
            <button class="tab" data-tab="town">小镇手绘图</button>
            <button class="tab" data-tab="world">世界地图</button>
          </div>
          <span class="dim">M / Esc 关闭</span>
          <button class="bm-x" data-close>✕</button>
        </div>
        <div class="bm-body">
          <div class="bm-view">
            <canvas id="bigmap-canvas"></canvas>
            <img id="bigmap-paper" alt="" />
            <div class="bm-zoom"><button data-zoom="in">＋</button><button data-zoom="out">－</button><button data-zoom="me" title="回到自己">◎</button></div>
          </div>
          <div id="bigmap-side"></div>
        </div>
      </div>
    </div>
    <!-- 手绘地图（M 键轮着看） -->
    <div id="papermap">
      <figure>
        <img id="papermap-img" alt="地图" />
        <figcaption id="papermap-cap"></figcaption>
      </figure>
    </div>
  </body>
</html>
